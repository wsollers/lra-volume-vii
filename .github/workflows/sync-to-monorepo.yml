name: Sync volume-vii to monorepo

on:
  push:
    branches: [main]
    paths:
      - 'volume-vii/**'
      - 'bibliography/volume-vii-numerical-approximation.bib'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lra-volume-vii
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: wsollers/Learning-Real-Analysis
          token: ${{ secrets.SYNC_PAT }}
          path: monorepo

      - name: Validate volume bibliography
        run: |
          cd source
          python scripts/check_bibliography.py --bib-dir bibliography

      - name: Validate volume
        run: |
          cd source
          python scripts/build_volume.py --validate-only

      - name: Sync volume-vii/ into monorepo
        run: |
          rsync -av --delete source/volume-vii/ monorepo/volume-vii/

      - name: Sync volume-vii bibliography into monorepo
        run: |
          mkdir -p monorepo/bibliography
          cp source/bibliography/volume-vii-numerical-approximation.bib monorepo/bibliography/volume-vii-numerical-approximation.bib

      - name: Commit and push if changed
        run: |
          cd monorepo
          git config user.name  "lra-sync-bot"
          git config user.email "sync-bot@noreply.github.com"
          git add volume-vii/ bibliography/volume-vii-numerical-approximation.bib
          git diff --cached --quiet && echo "No changes to sync" && exit 0
          git commit -m "chore: sync volume-vii from lra-volume-vii"
          git push
